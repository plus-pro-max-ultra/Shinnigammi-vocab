u7684\u300C\u3078\u300D\u3002",examples:[{text:"\u56F3\u66F8\u9928\u3067\u52C9\u5F37\u3057\u307E\u3059\u3002",zh:"\u6211\u5728\u5716\u66F8\u9928\u8B80\u66F8\u3002"},{text:"\u4F1A\u793E\u3067\u50CD\u304D\u307E\u3059\u3002",zh:"\u6211\u5728\u516C\u53F8\u5DE5\u4F5C\u3002"},{text:"\u5E97\u3067\u30D1\u30F3\u3092\u8CB7\u3044\u307E\u3059\u3002",zh:"\u6211\u5728\u5546\u5E97\u8CB7\u9EB5\u5305\u3002"}],sourceUrl:"https://nihongocircle.com/lessons/n5-04-places"},{id:"de-grammar-001",contentType:"grammar",lang:"de",title:"\u898F\u5247\u52D5\u8A5E\u73FE\u5728\u5F0F (Regular present tense)",rule:"For these -en verbs, remove -en to find the stem, then add the subject ending: wohnen \u2192 wohn- + ending.",ruleZh:"\u9019\u4E9B\u4EE5 -en \u7D50\u5C3E\u7684\u52D5\u8A5E\uFF0C\u5148\u53BB\u6389 -en \u5F97\u5230\u8A5E\u5E79\uFF0C\u518D\u4F9D\u4E3B\u8A5E\u52A0\u4E0A\u8A5E\u5C3E\uFF1Awohnen \u2192 wohn- \uFF0B\u8A5E\u5C3E\u3002",conjugation:[["ich","-e","wohne"],["du","-st","wohnst"],["er / sie / es","-t","wohnt"],["wir","-en","wohnen"],["ihr","-t","wohnt"],["sie / Sie","-en","wohnen"]],related:["de-110","de-125","de-128","de-171","de-177"],notes:[{en:"sein is irregular: ich bin, du bist, er/sie/es ist. Learn these forms separately.",zh:"sein \u662F\u4E0D\u898F\u5247\u52D5\u8A5E\uFF1Aich bin\u3001du bist\u3001er/sie/es ist\uFF0C\u9700\u53E6\u5916\u8A18\u61B6\u3002"},{en:"hei\xDFen: du hei\xDFt, not du hei\xDFst. After a stem ending in \xDF, the du ending is -t, with no extra s.",zh:"hei\xDFen \u7684 du \u5F62\u5F0F\u662F du hei\xDFt\uFF0C\u4E0D\u662F du hei\xDFst\u3002\u8A5E\u5E79\u4EE5 \xDF \u7D50\u5C3E\u6642\uFF0Cdu \u52A0 -t\uFF0C\u4E0D\u518D\u591A\u52A0 s\u3002"},{en:"In a statement, the conjugated verb is in position 2. A position is a sentence part, not always one word: In Berlin is one part. In a direct W-question, put the question word first and the verb next.",zh:"\u76F4\u8FF0\u53E5\u4E2D\uFF0C\u8B8A\u5316\u5F8C\u7684\u52D5\u8A5E\u653E\u5728\u7B2C\u4E8C\u500B\u53E5\u5B50\u6210\u5206\u7684\u4F4D\u7F6E\uFF0C\u4E0D\u4E00\u5B9A\u662F\u7B2C\u4E8C\u500B\u55AE\u5B57\uFF1AIn Berlin \u7B97\u4E00\u500B\u6210\u5206\u3002\u76F4\u63A5 W \u7591\u554F\u53E5\u5148\u653E\u7591\u554F\u8A5E\uFF0C\u518D\u63A5\u52D5\u8A5E\u3002"}],examples:[{text:"Ich wohne in Berlin.",en:"I live in Berlin.",zh:"\u6211\u4F4F\u5728\u67CF\u6797\u3002"},{text:"In Berlin wohne ich.",en:"I live in Berlin. (Berlin comes first for emphasis.)",zh:"\u6211\u4F4F\u5728\u67CF\u6797\u3002\uFF08\u5C07\u300C\u5728\u67CF\u6797\u300D\u653E\u53E5\u9996\u4F5C\u5F37\u8ABF\u3002\uFF09"},{text:"Wo wohnst du?",en:"Where do you live?",zh:"\u4F60\u4F4F\u5728\u54EA\u88E1\uFF1F"}],sourceUrl:"https://kahibaro.com/course/52-german/4115-present-tense-of-regular-verbs",sources:[{label:"Present tense & endings",url:"https://kahibaro.com/course/52-german/4115-present-tense-of-regular-verbs"},{label:"Goethe A1 grammar",url:"https://lernen.goethe.de/deutschonline/A1/PDF/DE/deutschonline_Redemittel_und_Grammatik_1-18.pdf"}]},{id:"jp-grammar-003",contentType:"grammar",lang:"jp",title:"\u3053\u308C\uFF0F\u305D\u308C\uFF0F\u3042\u308C\u306F\u301C\u3067\u3059\u304B",rule:"\u300C\u3053\u308C\u300D\u6307\u9760\u8FD1\u8AAA\u8A71\u8005\u7684\u6771\u897F\uFF1B\u300C\u305D\u308C\u300D\u6307\u9760\u8FD1\u807D\u8A71\u8005\u7684\u6771\u897F\uFF1B\u300C\u3042\u308C\u300D\u6307\u96E2\u96D9\u65B9\u90FD\u9060\u7684\u6771\u897F\u3002\u300C\u301C\u306F\u301C\u3067\u3059\u300D\u7528\u4F86\u8AAA\u660E\uFF1B\u53E5\u5C3E\u52A0\u300C\u304B\u300D\u8B8A\u6210\u79AE\u8C8C\u554F\u53E5\u3002\u300C\u306F\u300D\u4F5C\u52A9\u8A5E\u6642\u8B80\u4F5C\u300C\u308F\u300D\u3002\u300C\u4F55\u3067\u3059\u304B\u300D\u7684\u300C\u4F55\u300D\u8B80\u4F5C\u300C\u306A\u3093\u300D\u3002",examples:[{text:"\u3053\u308C\u306F\u308A\u3093\u3054\u3067\u3059\u3002",zh:"\u9019\u662F\u860B\u679C\u3002"},{text:"\u305D\u308C\u306F\u304A\u8336\u3067\u3059\u304B\u3002",zh:"\u90A3\u662F\u8336\u55CE\uFF1F"},{text:"\u3042\u308C\u306F\u4F55\u3067\u3059\u304B\u3002",zh:"\u90A3\u908A\u90A3\u500B\u662F\u4EC0\u9EBC\uFF1F"}],sourceUrl:"https://www.tofugu.com/japanese-grammar/kore-sore-are-dore/"},{id:"jp-grammar-004",contentType:"grammar",lang:"jp",title:"\u301C\u304C\u597D\u304D\u3067\u3059",rule:"\u300C\uFF08\u79C1\u306F\uFF09\uFF0B\u540D\u8A5E\uFF0B\u304C\u597D\u304D\u3067\u3059\u300D\u8868\u793A\u559C\u6B61\u67D0\u7269\u3002\u559C\u6B61\u7684\u5C0D\u8C61\u5F8C\u7528\u300C\u304C\u300D\u3002\u300C\u597D\u304D\u300D\u662F\u306A\u5F62\u5BB9\u8A5E\uFF0C\u4E0D\u662F\u52D5\u8A5E\uFF1B\u653E\u5728\u540D\u8A5E\u524D\u6642\u7528\u300C\u597D\u304D\u306A\uFF0B\u540D\u8A5E\u300D\u3002",examples:[{text:"\u79C1\u306F\u9B5A\u304C\u597D\u304D\u3067\u3059\u3002",zh:"\u6211\u559C\u6B61\u9B5A\u3002"},{text:"\u30B3\u30FC\u30D2\u30FC\u304C\u597D\u304D\u3067\u3059\u304B\u3002",zh:"\u4F60\u559C\u6B61\u5496\u5561\u55CE\uFF1F"},{text:"\u597D\u304D\u306A\u98DF\u3079\u7269\u306F\u4F55\u3067\u3059\u304B\u3002",zh:"\u4F60\u559C\u6B61\u7684\u98DF\u7269\u662F\u4EC0\u9EBC\uFF1F"}],sourceUrl:"https://www.irodori.jpf.go.jp/starter/pdf.html"},{id:"jp-grammar-005",contentType:"grammar",lang:"jp",title:"\u3044\u5F62\u5BB9\u8A5E\uFF1A\u304A\u3044\u3057\u3044",rule:"\u300C\u304A\u3044\u3057\u3044\u300D\u662F\u3044\u5F62\u5BB9\u8A5E\u3002\u79AE\u8C8C\u5730\u63CF\u8FF0\u5473\u9053\u6642\u7528\u300C\u540D\u8A5E\uFF0B\u306F\uFF0B\u304A\u3044\u3057\u3044\u3067\u3059\u300D\uFF1B\u653E\u5728\u540D\u8A5E\u524D\u76F4\u63A5\u63A5\u300C\u304A\u3044\u3057\u3044\uFF0B\u540D\u8A5E\u300D\uFF0C\u4E0D\u52A0\u300C\u306A\u300D\u3002",examples:[{text:"\u3053\u306E\u30D1\u30F3\u306F\u304A\u3044\u3057\u3044\u3067\u3059\u3002",zh:"\u9019\u500B\u9EB5\u5305\u5F88\u597D\u5403\u3002"},{text:"\u304A\u3044\u3057\u3044\u3054\u98EF\u3092\u98DF\u3079\u307E\u3059\u3002",zh:"\u6211\u5403\u597D\u5403\u7684\u98EF\u3002"}],sourceUrl:"https://www.irodori.jpf.go.jp/starter/pdf.html"},{id:"de-grammar-002",contentType:"grammar",lang:"de",title:"\u554F\u53E5\uFF1AW \u554F\u53E5\u8207\u662F\u975E\u554F\u53E5 (Questions: W-questions and yes/no questions)",rule:"W-questions start with a question word, followed by the conjugated verb: question word + verb + subject. For a yes/no question, put the conjugated verb first: verb + subject. Answer a yes/no question with Ja or Nein.",ruleZh:"W \u554F\u53E5\u5148\u653E\u7591\u554F\u8A5E\uFF0C\u518D\u63A5\u8B8A\u5316\u5F8C\u7684\u52D5\u8A5E\uFF1A\u7591\u554F\u8A5E\uFF0B\u52D5\u8A5E\uFF0B\u4E3B\u8A5E\u3002\u662F\u975E\u554F\u53E5\u628A\u8B8A\u5316\u5F8C\u7684\u52D5\u8A5E\u653E\u53E5\u9996\uFF1A\u52D5\u8A5E\uFF0B\u4E3B\u8A5E\u3002\u662F\u975E\u554F\u53E5\u53EF\u4EE5\u7528 Ja\uFF08\u662F\uFF09\u6216 Nein\uFF08\u4E0D\u662F\uFF09\u56DE\u7B54\u3002",notes:[{en:"Wie asks about a name in Wie hei\xDFt du?; wo asks about a place; woher asks about origin; wer asks about a person. In these examples, du is informal and Sie is formal.",zh:"Wie hei\xDFt du? \u7528 wie \u554F\u59D3\u540D\uFF1Bwo \u554F\u5730\u9EDE\uFF1Bwoher \u554F\u4F86\u81EA\u54EA\u88E1\uFF1Bwer \u554F\u4EBA\u3002\u9019\u4E9B\u4F8B\u53E5\u4E2D\uFF0Cdu \u662F\u975E\u6B63\u5F0F\u7684\u300C\u4F60\u300D\uFF0CSie \u662F\u79AE\u8C8C\u7684\u300C\u60A8\u300D\u3002"},{en:"Capitalize German nouns, including Deutsch (the language), Taiwan and Name. The formal pronoun Sie is also capitalized.",zh:"\u5FB7\u6587\u540D\u8A5E\u958B\u982D\u8981\u5927\u5BEB\uFF0C\u4F8B\u5982 Deutsch\uFF08\u5FB7\u8A9E\uFF09\u3001Taiwan\uFF08\u53F0\u7063\uFF09\u3001Name\uFF08\u540D\u5B57\uFF09\u3002\u79AE\u8C8C\u4EE3\u540D\u8A5E Sie \u4E5F\u8981\u5927\u5BEB\u3002"}],examples:[{text:"Wie hei\xDFt du?",en:"What is your name?",zh:"\u4F60\u53EB\u4EC0\u9EBC\u540D\u5B57\uFF1F"},{text:"Wo wohnst du?",en:"Where do you live?",zh:"\u4F60\u4F4F\u5728\u54EA\u88E1\uFF1F"},{text:"Woher kommst du?",en:"Where are you from?",zh:"\u4F60\u4F86\u81EA\u54EA\u88E1\uFF1F"},{text:"Wer bist du?",en:"Who are you?",zh:"\u4F60\u662F\u8AB0\uFF1F"},{text:"Wohnst du in Taipei?",en:"Do you live in Taipei?",zh:"\u4F60\u4F4F\u5728\u53F0\u5317\u55CE\uFF1F"},{ 6F02\u4EAE\u7684\u82B1\u3002"},{text:"\u65B0\u3057\u3044\u304B\u3070\u3093\u3092\u8CB7\u3044\u307E\u3057\u305F\u3002",zh:"\u6211\u8CB7\u4E86\u65B0\u7684\u5305\u5305\u3002"}],related:["jp-052","jp-053","jp-054","jp-055","jp-056","jp-057","jp-058","jp-059","jp-060","jp-061","jp-062","jp-063","jp-064","jp-065","jp-066"],sourceUrl:"https://guidetojapanese.org/learn/grammar/adjectives"},{id:"de-grammar-003",contentType:"grammar",lang:"de",title:"haben (\u6709 / to have)",rule:"haben means \u201Cto have\u201D. Most forms follow the regular -en pattern, but du and er/sie/es drop the -b from the stem: du hast, er/sie/es hat. As a main verb, haben stays in second position: Ich habe eine Frage. In a yes/no question, it comes first: Hast du eine Frage?",ruleZh:"haben \u662F\u300C\u6709\u300D\u3002\u5927\u90E8\u5206\u8B8A\u5316\u4F9D -en \u898F\u5247\u52D5\u8A5E\uFF0C\u4F46 du \u548C er/sie/es \u8981\u53BB\u6389\u8A5E\u5E79\u7684 -b\uFF1Adu hast\u3001er/sie/es hat\u3002\u4F5C\u70BA\u4E3B\u52D5\u8A5E\u6642\u4E00\u6A23\u653E\u5728\u53E5\u5B50\u7B2C\u4E8C\u4F4D\uFF1AIch habe eine Frage. \u662F\u975E\u554F\u53E5\u628A\u52D5\u8A5E\u653E\u53E5\u9996\uFF1AHast du eine Frage?",conjTitle:"haben \xB7 to have / \u6709",conjugation:[["ich","-e","habe"],["du","-st","hast"],["er / sie / es","-t","hat"],["wir","-en","haben"],["ihr","-t","habt"],["sie / Sie","-en","haben"]],related:["de-294"],notes:[{en:"Irregular: du hast and er/sie/es hat drop the -b from the stem hab-. The other persons keep it: ich habe, wir haben, ihr habt.",zh:"\u4E0D\u898F\u5247\uFF1Adu hast \u548C er/sie/es hat \u53BB\u6389\u8A5E\u5E79 hab- \u7684 -b\u3002\u5176\u4ED6\u4EBA\u7A31\u4FDD\u7559\uFF1Aich habe\u3001wir haben\u3001ihr habt\u3002"},{en:"Use sein (to be), not haben, for states like tired: Ich bin m\xFCde. (I am tired.) But for hungry, German uses haben: Ich habe Hunger. (literally \u201CI have hunger\u201D).",zh:"\u300C\u7D2F\u300D\u9019\u985E\u72C0\u614B\u7528 sein\uFF08\u662F\uFF09\uFF0C\u4E0D\u7528 haben\uF
